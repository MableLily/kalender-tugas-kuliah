<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalender Tugas Akademik</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Manrope',system-ui,sans-serif;background:#F5F7FA;color:#1B2433}
  .serif{font-family:'Fraunces',Georgia,serif}
  .st-belum{--c:#DC2626;--bg:#FEE2E2}
  .st-progress{--c:#CA8A04;--bg:#FEF3C7}
  .st-done{--c:#16A34A;--bg:#DCFCE7}
  .badge{background:var(--bg);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
  .dot{background:var(--c)}
  .bar{border-left:3px solid var(--c)}
  .chip{background:var(--bg);color:var(--c)}
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @media(prefers-reduced-motion:reduce){.sheet{animation:none}}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2B3A67;outline-offset:2px}
</style>
</head>
<body class="min-h-screen pb-28">
<div class="max-w-5xl mx-auto px-4 pt-6">

  <header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="serif text-3xl sm:text-4xl text-[#2B3A67]">Kalender Tugas</h1>
      <p class="text-sm text-slate-500 mt-1">Semester Oktober – Desember 2026</p>
    </div>
    <div class="flex gap-2">
      <button id="btnExport" class="flex-1 sm:flex-none px-3.5 py-2 text-sm font-semibold rounded-lg border border-slate-300 bg-white hover:bg-slate-50">Export Data (Backup)</button>
      <button id="btnImport" class="flex-1 sm:flex-none px-3.5 py-2 text-sm font-semibold rounded-lg border border-slate-300 bg-white hover:bg-slate-50">Import Data (Restore)</button>
      <input id="fileInput" type="file" accept=".json,application/json" class="hidden">
    </div>
  </header>

  <section id="counters" class="grid grid-cols-3 gap-2.5 sm:gap-4 mt-6"></section>

  <section class="mt-6 bg-white rounded-2xl border border-slate-200 p-3 sm:p-5">
    <div class="flex items-center justify-between gap-2">
      <button id="prev" aria-label="Bulan sebelumnya" class="w-10 h-10 rounded-full border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:hover:bg-transparent text-lg">‹</button>
      <div class="text-center">
        <h2 id="monthTitle" class="serif text-2xl text-[#2B3A67]"></h2>
        <div id="monthTabs" class="flex justify-center gap-1.5 mt-2"></div>
      </div>
      <button id="next" aria-label="Bulan berikutnya" class="w-10 h-10 rounded-full border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:hover:bg-transparent text-lg">›</button>
    </div>
    <div class="grid grid-cols-7 mt-4 text-center text-xs font-semibold text-slate-400">
      <div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div class="text-red-400">Sab</div><div class="text-red-400">Min</div>
    </div>
    <div id="grid" class="grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded-xl overflow-hidden mt-1.5"></div>
  </section>

  <section class="mt-6">
    <h3 class="font-bold text-lg" id="listTitle"></h3>
    <div id="monthList" class="mt-3 space-y-2.5"></div>
  </section>
</div>

<button id="fab" class="fixed bottom-5 right-5 sm:bottom-8 sm:right-8 px-5 py-3.5 rounded-full bg-[#2B3A67] text-white font-semibold shadow-lg hover:bg-[#222E52]">+ Tambah tugas</button>

<div id="overlay" class="hidden fixed inset-0 z-40 bg-slate-900/50 items-end sm:items-center justify-center p-0 sm:p-4">
  <div id="modal" class="sheet bg-white w-full sm:max-w-lg max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5"></div>
</div>
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg"></div>

<script>
const KEY='kalender-tugas-akademik-v1';
const MONTHS=[{m:9,n:'Oktober'},{m:10,n:'November'},{m:11,n:'Desember'}];
const ST={belum:{l:'Belum Dikerjakan',c:'st-belum'},progress:{l:'On Progress',c:'st-progress'},done:{l:'Done',c:'st-done'}};
const ORDER=['belum','progress','done'];
const PLACES=['Kulon','Dikumpulin di kelas'];
const MIN='2026-10-01',MAX='2026-12-31';
let tasks=load(),view=0;
const now=new Date();
if(now.getFullYear()===2026&&now.getMonth()>=9)view=now.getMonth()-9;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>pd(s).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const overdue=t=>t.status!=='done'&&new Date(`${t.date}T${t.time}`)<new Date();

function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return Array.isArray(r)?r:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){toast('Gagal menyimpan ke browser')}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}

/* ---------- Render ---------- */
function render(){
  $('counters').innerHTML=ORDER.map(s=>{
    const n=tasks.filter(t=>t.status===s).length;
    return `<button data-act="status" data-s="${s}" class="${ST[s].c} text-left bg-white rounded-xl border border-slate-200 bar p-3 sm:p-4 hover:shadow-md transition-shadow">
      <div class="text-2xl sm:text-3xl font-bold" style="color:var(--c)">${n}</div>
      <div class="text-[11px] sm:text-sm text-slate-600 font-semibold leading-tight mt-0.5">${ST[s].l}</div></button>`}).join('');

  const M=MONTHS[view];
  $('monthTitle').textContent=`${M.n} 2026`;
  $('prev').disabled=view===0;$('next').disabled=view===2;
  $('monthTabs').innerHTML=MONTHS.map((x,i)=>`<button data-act="goto" data-i="${i}" class="px-3 py-1 rounded-full text-xs font-semibold ${i===view?'bg-[#2B3A67] text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${x.n.slice(0,3)}</button>`).join('');

  const first=(new Date(2026,M.m,1).getDay()+6)%7,days=new Date(2026,M.m+1,0).getDate();
  const today=key(now.getFullYear(),now.getMonth(),now.getDate());
  let h='';
  for(let i=0;i<first;i++)h+='<div class="bg-slate-50 min-h-[56px] md:min-h-[100px]"></div>';
  for(let d=1;d<=days;d++){
    const k=key(2026,M.m,d),ts=tasks.filter(t=>t.date===k).sort(byTime),isT=k===today;
    h+=`<button data-act="day" data-d="${k}" class="bg-white text-left p-1 md:p-1.5 min-h-[56px] md:min-h-[100px] hover:bg-slate-50 flex flex-col">
      <span class="text-xs md:text-sm font-semibold w-6 h-6 flex items-center justify-center rounded-full ${isT?'bg-[#2B3A67] text-white':'text-slate-700'}">${d}</span>
      <span class="md:hidden flex flex-wrap gap-0.5 mt-1 px-0.5">${ts.slice(0,6).map(t=>`<i class="${ST[t.status].c} dot w-1.5 h-1.5 rounded-full"></i>`).join('')}</span>
      <span class="hidden md:block mt-1 space-y-0.5 w-full">${ts.slice(0,2).map(t=>`<span class="${ST[t.status].c} chip block truncate text-[11px] font-semibold rounded px-1.5 py-0.5">${t.time} ${esc(t.title)}</span>`).join('')}${ts.length>2?`<span class="block text-[11px] text-slate-400 px-1">+${ts.length-2} lagi</span>`:''}</span>
    </button>`;
  }
  const rest=(7-(first+days)%7)%7;
  for(let i=0;i<rest;i++)h+='<div class="bg-slate-50 min-h-[56px] md:min-h-[100px]"></div>';
  $('grid').innerHTML=h;

  const list=tasks.filter(t=>pd(t.date).getMonth()===M.m).sort(byTime);
  $('listTitle').textContent=`Tugas bulan ${M.n} (${list.length})`;
  $('monthList').innerHTML=list.length?list.map(t=>row(t)).join(''):
    `<div class="bg-white border border-dashed border-slate-300 rounded-xl p-6 text-center text-sm text-slate-500">Belum ada tugas di ${M.n}. Tekan “Tambah tugas” untuk mulai mengisi.</div>`;
}

function row(t){
  return `<div class="${ST[t.status].c} bg-white rounded-xl border border-slate-200 bar p-3 flex items-start gap-3">
    <div class="flex-1 min-w-0">
      <div class="font-semibold break-words">${esc(t.title)}</div>
      <div class="text-xs text-slate-500 mt-1">${fd(t.date)} · ${t.time} · ${esc(t.place)}${overdue(t)?' <span class="text-red-600 font-semibold">· Terlewat</span>':''}</div>
      <button data-act="cycle" data-id="${t.id}" title="Ketuk untuk ganti status" class="badge mt-2 px-2.5 py-1 rounded-full text-xs font-bold">${ST[t.status].l} ⟳</button>
    </div>
    <div class="flex flex-col gap-1 text-xs">
      <button data-act="edit" data-id="${t.id}" class="px-2.5 py-1.5 rounded-md border border-slate-200 hover:bg-slate-50">Edit</button>
      <button data-act="del" data-id="${t.id}" class="px-2.5 py-1.5 rounded-md border border-slate-200 text-red-600 hover:bg-red-50">Hapus</button>
    </div></div>`;
}

/* ---------- Modals ---------- */
function open(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden');$('overlay').classList.add('flex')}
function close(){$('overlay').classList.add('hidden');$('overlay').classList.remove('flex')}
const head=(t,sub='')=>`<div class="flex items-start justify-between gap-3 mb-4"><div><h3 class="serif text-xl text-[#2B3A67]">${t}</h3>${sub?`<p class="text-sm text-slate-500">${sub}</p>`:''}</div><button data-act="close" aria-label="Tutup" class="text-2xl leading-none text-slate-400 hover:text-slate-700">×</button></div>`;

let current=null; // {type:'status'|'day', v}
function showStatus(s){
  current={type:'status',v:s};
  const l=tasks.filter(t=>t.status===s).sort(byTime);
  open(head(ST[s].l,`${l.length} tugas · Oktober – Desember 2026`)+
    (l.length?`<div class="space-y-2.5">${l.map(row).join('')}</div>`:'<p class="text-sm text-slate-500 py-6 text-center">Belum ada tugas dengan status ini.</p>'));
}
function showDay(k){
  current={type:'day',v:k};
  const l=tasks.filter(t=>t.date===k).sort(byTime);
  open(head(pd(k).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),`${l.length} tugas`)+
    `<div class="space-y-2.5">${l.map(row).join('')||'<p class="text-sm text-slate-500 py-4 text-center">Belum ada tugas di hari ini.</p>'}</div>
     <button data-act="add" data-d="${k}" class="mt-4 w-full py-3 rounded-lg bg-[#2B3A67] text-white font-semibold">+ Tambah tugas di tanggal ini</button>`);
}
function refreshModal(){
  if(!current||$('overlay').classList.contains('hidden'))return;
  current.type==='status'?showStatus(current.v):showDay(current.v);
}
function showForm(id,date){
  const t=tasks.find(x=>x.id===id)||{title:'',date:date||'',time:'23:59',place:PLACES[0],status:'belum'};
  current=null;
  open(head(id?'Edit tugas':'Tambah tugas')+`
  <div class="space-y-4" id="form" data-id="${id||''}">
    <label class="block text-sm font-semibold">Judul tugas / mata kuliah
      <input id="fTitle" maxlength="120" value="${esc(t.title)}" placeholder="mis. Makalah Statistika" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 font-normal"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="block text-sm font-semibold">Tanggal
        <input id="fDate" type="date" min="${MIN}" max="${MAX}" value="${t.date}" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 font-normal"></label>
      <label class="block text-sm font-semibold">Jam pengumpulan
        <input id="fTime" type="time" value="${t.time}" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 font-normal"></label>
    </div>
    <label class="block text-sm font-semibold">Tempat pengumpulan
      <select id="fPlace" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 font-normal bg-white">${PLACES.map(p=>`<option ${p===t.place?'selected':''}>${p}</option>`).join('')}</select></label>
    <div><div class="text-sm font-semibold mb-1">Status</div>
      <div class="grid grid-cols-3 gap-2" id="fStatus">${ORDER.map(s=>`<button type="button" data-act="pick" data-s="${s}" class="${ST[s].c} badge py-2 rounded-lg text-xs font-bold ${s===t.status?'ring-2 ring-offset-1 ring-[color:var(--c)]':'opacity-60'}" aria-pressed="${s===t.status}">${ST[s].l}</button>`).join('')}</div>
      <input type="hidden" id="fStat" value="${t.status}"></div>
    <p id="fErr" class="text-sm text-red-600 hidden"></p>
    <div class="flex gap-2 pt-1">
      <button data-act="close" class="flex-1 py-3 rounded-lg border border-slate-300 font-semibold">Batal</button>
      <button data-act="save" class="flex-1 py-3 rounded-lg bg-[#2B3A67] text-white font-semibold">Simpan tugas</button>
    </div></div>`);
  setTimeout(()=>$('fTitle').focus(),50);
}
function saveForm(){
  const f=$('form'),id=f.dataset.id,title=$('fTitle').value.trim(),date=$('fDate').value,time=$('fTime').value||'23:59';
  const err=m=>{$('fErr').textContent=m;$('fErr').classList.remove('hidden')};
  if(!title)return err('Isi judul tugas dulu.');
  if(!date||date<MIN||date>MAX)return err('Pilih tanggal antara 1 Oktober dan 31 Desember 2026.');
  const o={title,date,time,place:$('fPlace').value,status:$('fStat').value};
  if(id){Object.assign(tasks.find(t=>t.id===id),o)}else tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...o});
  save();view=pd(date).getMonth()-9;close();render();toast('Tugas disimpan');
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('overlay'))return close();
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='close')close();
  else if(a==='status')showStatus(b.dataset.s);
  else if(a==='day')showDay(b.dataset.d);
  else if(a==='goto'){view=+b.dataset.i;render()}
  else if(a==='add')showForm(null,b.dataset.d);
  else if(a==='edit')showForm(id);
  else if(a==='save')saveForm();
  else if(a==='pick'){$('fStat').value=b.dataset.s;document.querySelectorAll('#fStatus button').forEach(x=>{const on=x===b;x.classList.toggle('ring-2',on);x.classList.toggle('ring-offset-1',on);x.classList.toggle('opacity-60',!on);x.setAttribute('aria-pressed',on)});b.style.setProperty('--tw-ring-color',getComputedStyle(b).getPropertyValue('--c'))}
  else if(a==='cycle'){const t=tasks.find(x=>x.id===id);t.status=ORDER[(ORDER.indexOf(t.status)+1)%3];save();render();refreshModal()}
  else if(a==='del'){const t=tasks.find(x=>x.id===id);if(confirm(`Hapus “${t.title}”?`)){tasks=tasks.filter(x=>x.id!==id);save();render();refreshModal();toast('Tugas dihapus')}}
});
$('fab').onclick=()=>showForm();
$('prev').onclick=()=>{if(view>0){view--;render()}};
$('next').onclick=()=>{if(view<2){view++;render()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('fT')&&$('form'))saveForm()});

/* ---------- Export / Import ---------- */
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'kalender-tugas-akademik',version:1,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`kalender-tugas-${key(now.getFullYear(),now.getMonth(),now.getDate())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`${tasks.length} tugas diexport`);
};
$('btnImport').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.tasks;
      if(!Array.isArray(arr))throw 0;
      const ok=arr.filter(t=>t&&t.title&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&ST[t.status]).map(t=>({
        id:String(t.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
        title:String(t.title).slice(0,120),date:t.date,time:/^\d{2}:\d{2}$/.test(t.time)?t.time:'23:59',
        place:PLACES.includes(t.place)?t.place:PLACES[0],status:t.status}));
      if(!ok.length&&arr.length)throw 0;
      if(confirm(`Ganti data saat ini (${tasks.length} tugas) dengan ${ok.length} tugas dari file ini?`)){tasks=ok;save();render();toast('Data berhasil di-restore')}
    }catch(x){alert('File tidak valid. Pilih file .json hasil Export dari aplikasi ini.')}
    e.target.value='';
  };
  r.readAsText(f);
};

render();
</script>
</body>
</html>
